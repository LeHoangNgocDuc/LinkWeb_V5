<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Phúc Link Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- Sidebar Trái -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col p-5">
        <!-- Logo (Gọi trực tiếp file logo.jpg cùng thư mục) -->
        <div class="flex items-center gap-3 mb-10 pl-2">
            <img src="logo.jpg" alt="Logo" class="w-11 h-11 rounded-xl shadow-sm object-cover border border-gray-100">
            <div>
                <h1 class="font-bold text-lg leading-tight text-gray-900">Link Hub</h1>
                <p class="text-[10px] text-gray-500 font-bold tracking-wider">AN PHÚC CENTER</p>
            </div>
        </div>

        <!-- Menu Danh Mục -->
        <div class="text-xs font-semibold text-gray-400 mb-4 pl-2">DANH MỤC</div>
        <nav class="flex flex-col gap-1 flex-1">
            <a href="#" onclick="filterCategory('Tất cả')" class="flex items-center gap-3 bg-blue-600 text-white px-4 py-3 rounded-xl font-medium transition hover:bg-blue-700">
                <i class="fa-solid fa-border-all"></i> Tất cả
            </a>
            <a href="#" onclick="filterCategory('Công việc')" class="flex items-center gap-3 text-gray-600 px-4 py-3 rounded-xl font-medium transition hover:bg-gray-100">
                <i class="fa-solid fa-briefcase"></i> Công việc
            </a>
            <a href="#" onclick="filterCategory('Trung tâm An Phúc')" class="flex items-center gap-3 text-gray-600 px-4 py-3 rounded-xl font-medium transition hover:bg-gray-100">
                <i class="fa-regular fa-heart"></i> Trung tâm An Phúc
            </a>
            <a href="#" onclick="filterCategory('Công cụ Web')" class="flex items-center gap-3 text-gray-600 px-4 py-3 rounded-xl font-medium transition hover:bg-gray-100">
                <i class="fa-solid fa-wrench"></i> Công cụ Web
            </a>
        </nav>

        <!-- Mẹo nhỏ -->
        <div class="bg-blue-50 p-4 rounded-xl mt-auto">
            <h4 class="font-bold text-sm text-blue-900 mb-1">Mẹo nhỏ</h4>
            <p class="text-xs text-blue-700">Sử dụng phím / để tìm kiếm nhanh các liên kết của bạn.</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 h-20 px-8 flex items-center justify-between shrink-0">
            <div class="relative w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm nhanh tài liệu, công cụ AI, website..." class="w-full bg-gray-50 border border-gray-200 rounded-full py-2.5 pl-11 pr-4 text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition" onkeyup="searchLinks()">
            </div>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-full shadow-md shadow-blue-200 transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> THÊM MỚI
            </button>
        </header>

        <!-- Lưới dữ liệu -->
        <div class="flex-1 p-8 overflow-y-auto hide-scroll" id="mainContainer">
            <div id="loading" class="text-center text-gray-500 py-10 hidden">Đang tải dữ liệu...</div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="dataGrid">
                <!-- Thẻ dữ liệu sẽ được render vào đây bằng JS -->
            </div>
        </div>
    </main>

    <!-- ================= MODAL KHU VỰC ================= -->

    <!-- Modal Thêm Mới -->
    <div id="addModal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-2xl w-[400px] shadow-xl">
            <h2 class="text-xl font-bold mb-5 text-gray-800">Thêm Liên Kết Mới</h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="cat" placeholder="Danh Mục (VD: Công cụ Web)" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white outline-blue-500">
                <input type="text" id="name" placeholder="Tên Trang Web" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white outline-blue-500">
                <input type="text" id="link" placeholder="Link URL (https://...)" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white outline-blue-500">
                <input type="text" id="acc" placeholder="Tài Khoản" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white outline-blue-500">
                <input type="password" id="pass" placeholder="Mật Khẩu" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white outline-blue-500">
            </div>
            <div class="flex gap-3 justify-end mt-6">
                <button onclick="closeAddModal()" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium text-sm">Hủy</button>
                <button onclick="addData()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <!-- Modal Xác Thực OTP -->
    <div id="otpModal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-8 rounded-2xl w-96 text-center shadow-xl">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-xl font-bold mb-2 text-gray-800">Xác thực Admin</h2>
            <p class="text-xs text-gray-500 mb-6">Mã OTP đã được gửi về email admin hệ thống An Phúc.</p>
            <input type="text" id="otpCode" placeholder="Nhập mã OTP 6 số" class="w-full border-2 border-gray-200 p-3 rounded-xl mb-6 text-center text-xl tracking-widest font-bold focus:border-blue-500 outline-none">
            <div class="flex gap-3 justify-center">
                <button onclick="closeOTPModal()" class="flex-1 bg-gray-100 text-gray-600 py-2.5 rounded-xl font-medium hover:bg-gray-200">Hủy</button>
                <button onclick="verifyOTP()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-medium hover:bg-blue-700 shadow-md shadow-blue-200">Xác nhận</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyg8zZR2JAIxOhOJY6sU1qs4TdI71eQKNRX3vtwOM0pMQNLGtheAdfBfy_2V2Szrzni/exec"; // BẮT BUỘC THAY URL MỚI VÀO ĐÂY
        const SECRET_TOKEN = "ThayDuc_Authentication_Secret_Token_Long_String_2026";
        let currentActionId = null;
        let allData = [];

        // Tạo ký tự đại diện cho icon
        function getInitials(name) {
            return name.substring(0, 1).toUpperCase();
        }

        async function loadData() {
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("dataGrid").innerHTML = "";
            try {
                let res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getList" }) });
                let result = await res.json();
                allData = result.data;
                renderCards(allData);
            } catch(e) {
                alert("Lỗi tải dữ liệu. Vui lòng kiểm tra lại URL App Script.");
            }
            document.getElementById("loading").classList.add("hidden");
        }

        function renderCards(data) {
            let html = "";
            data.forEach(row => {
                let domain = row.link.replace('https://', '').replace('http://', '').split('/')[0];
                let initial = getInitials(row.name);
                
                html += `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col hover:shadow-md transition-shadow group relative">
                    <!-- Nút xóa (Ẩn, hiện khi hover) -->
                    <button onclick="deleteData('${row.id}')" class="absolute top-3 right-3 text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash-can"></i></button>
                    
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold text-white bg-gradient-to-br from-blue-400 to-indigo-500 shadow-inner shrink-0">
                            ${initial}
                        </div>
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-gray-800 text-[15px] truncate" title="${row.name}">${row.name}</h3>
                            <p class="text-[11px] text-gray-400 truncate">${domain}</p>
                        </div>
                    </div>
                    
                    <div class="mt-auto pt-4 border-t border-gray-50 flex items-center justify-between">
                        <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider bg-gray-100 px-2.5 py-1 rounded-md">${row.category}</span>
                        <div class="flex items-center gap-3">
                            <button onclick="requestViewPass('${row.id}')" class="text-gray-400 hover:text-purple-600 transition" title="Xem Mật Khẩu">
                                <i class="fa-solid fa-key"></i>
                            </button>
                            <a href="${row.link}" target="_blank" class="text-sm font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1">
                                Truy cập <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById("dataGrid").innerHTML = html;
        }

        function searchLinks() {
            let keyword = document.getElementById("searchInput").value.toLowerCase();
            let filtered = allData.filter(row => row.name.toLowerCase().includes(keyword) || row.category.toLowerCase().includes(keyword));
            renderCards(filtered);
        }

        function filterCategory(cat) {
            if(cat === 'Tất cả') renderCards(allData);
            else renderCards(allData.filter(row => row.category === cat));
        }

        function openAddModal() { document.getElementById("addModal").classList.remove("hidden"); }
        function closeAddModal() { document.getElementById("addModal").classList.add("hidden"); }

        async function addData() {
            let payload = {
                action: "add",
                category: document.getElementById("cat").value || "Khác",
                name: document.getElementById("name").value,
                link: document.getElementById("link").value,
                account: document.getElementById("acc").value,
                password: document.getElementById("pass").value
            };
            closeAddModal();
            document.getElementById("loading").classList.remove("hidden");
            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
            // Clear form
            ['cat','name','link','acc','pass'].forEach(id => document.getElementById(id).value = '');
            loadData();
        }

        async function deleteData(id) {
            if(confirm("Thầy có chắc chắn muốn xóa liên kết này?")) {
                await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "delete", id: id }) });
                loadData();
            }
        }

        // ====== LOGIC OTP & XEM MẬT KHẨU ======
        function closeOTPModal() {
            document.getElementById("otpModal").classList.add("hidden");
            document.getElementById("otpCode").value = "";
        }

        async function requestViewPass(id) {
            currentActionId = id;
            let sessionToken = sessionStorage.getItem("adminSession");
            
            if (sessionToken) {
                fetchPassword(id, sessionToken);
                return;
            }
            alert("Hệ thống đang tạo mã OTP và gửi đến email, vui lòng đợi vài giây...");
            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "requestOTP" }) });
            document.getElementById("otpModal").classList.remove("hidden");
        }

        async function verifyOTP() {
            let otp = document.getElementById("otpCode").value;
            let res = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "verifyOTP", otp: otp })
            });
            let data = await res.json();
            
            if (data.status === "success") {
                sessionStorage.setItem("adminSession", data.sessionToken);
                closeOTPModal();
                fetchPassword(currentActionId, data.sessionToken);
            } else {
                alert(data.message);
            }
        }

        async function fetchPassword(id, sessionToken) {
            let rowInfo = allData.find(r => r.id === id);
            let res = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "getPass", id: id, token: SECRET_TOKEN, sessionToken: sessionToken 
                })
            });
            let data = await res.json();
            if (data.status === "success") {
                alert(`Tài khoản: ${rowInfo.account}\nMật khẩu: ${data.pass}`);
            } else {
                alert("Lỗi: " + data.message);
                sessionStorage.removeItem("adminSession"); // Xóa session nếu lỗi
            }
        }

        // Gắn sự kiện phím tắt "/" để focus vào ô tìm kiếm (Mẹo nhỏ)
        document.addEventListener('keyup', (e) => {
            if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
                document.getElementById('searchInput').focus();
            }
        });

        window.onload = loadData;
    </script>
</body>
</html>
